<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 確保在手機上比例正確 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的營養儀表板</title>
    <!-- 引入開源圖表庫 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 20px; background-color: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>近期熱量攝取趨勢</h2>
        <canvas id="calorieChart"></canvas>
    </div>

    <script>
        // 1. 初始化 LIFF
        liff.init({
            liffId: "2011395673-tx0PwnXv" // 例如 "1234567890-abcdefgh"
            }).then(() => {
                if (liff.isLoggedIn()) {
                    // 2. 成功登入後，自動抓取使用者的 LINE ID
                    liff.getProfile().then(profile => {
                        const userId = profile.userId;
                        
                        // 3. 拿著真實的 userId 去跟 Python 後端要圖表資料
                        fetch(`/api/nutrition/${userId}`)
                            .then(response => response.json())
                            .then(data => {
                                const ctx = document.getElementById('calorieChart').getContext('2d');
                                new Chart(ctx, {
                                    type: 'bar',
                                    data: {
                                        labels: data.labels,
                                        datasets: [{
                                            label: '預估熱量 (大卡)',
                                            data: data.calories,
                                            backgroundColor: 'rgba(255, 159, 64, 0.6)',
                                            borderColor: 'rgba(255, 159, 64, 1)',
                                            borderWidth: 1,
                                            borderRadius: 4
                                        }]
                                    },
                                    options: { responsive: true, scales: { y: { beginAtZero: true } } }
                                });
                            })
                            .catch(err => {
                                alert("取得 Profile 失敗：" + err); 
                            });
                    });
                } 
                else {
                    // 如果沒有登入，強制跳轉到 LINE 登入畫面
                    liff.login();
                }
            }).catch((err) => {
                console.error("LIFF 初始化失敗", err);
            });
    </script>
</body>
</html>
