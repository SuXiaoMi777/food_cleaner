<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 確保在手機上比例正確 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的營養儀表板</title>
    <!-- 引入開源圖表庫 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 20px; background-color: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>近期熱量攝取趨勢</h2>
        <canvas id="calorieChart"></canvas>
    </div>

    <script>
        alert("網頁載入中，準備初始化 LIFF...");

        liff.init({
            liffId: "2011395673-tx0PwnXv"
        }).then(() => {
            alert("1. LIFF 初始化成功！");
            
            if (liff.isLoggedIn()) {
                alert("2. 確認為登入狀態，準備抓取 ID");
                
                liff.getProfile().then(profile => {
                    // const userId = profile.userId;
                    // this is a test program
                    const userId = "U852ca0872553675ef837bf0b02636f9b"
                    alert("3. 成功拿到 ID：" + userId + "，準備呼叫 API");
                    
                    fetch(`/api/nutrition/${userId}`)
                        .then(response => response.json())
                        .then(data => {
                            alert("4. 後端 API 回傳成功！資料筆數：" + data.labels.length);
                            
                            const ctx = document.getElementById('calorieChart').getContext('2d');
                            new Chart(ctx, {
                                type: 'bar',
                                data: {
                                    labels: data.labels,
                                    datasets: [{
                                        label: '預估熱量 (大卡)',
                                        data: data.calories,
                                        backgroundColor: 'rgba(255, 159, 64, 0.6)',
                                        borderColor: 'rgba(255, 159, 64, 1)',
                                        borderWidth: 1,
                                        borderRadius: 4
                                    }]
                                },
                                options: { responsive: true, scales: { y: { beginAtZero: true } } }
                            });
                        })
                        .catch(err => {
                            alert("X. 後端 API 呼叫失敗：" + err);
                        });
                }).catch(err => {
                    // 正確捕捉 getProfile 的錯誤
                    alert("X. 取得 Profile 失敗：" + err); 
                });
            } else {
                alert("X. 偵測到未登入，強制跳轉 login");
                liff.login();
            }
        }).catch((err) => {
            alert("X. LIFF 初始化失敗：" + err);
        });
    </script>
</body>
</html>
