<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的營養儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
            padding: 20px 15px; 
            margin: 0;
            background: linear-gradient(135deg, #f6f8fb 0%, #e5ebf4 100%);
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 22px;
            color: #333;
            margin: 0 0 4px 0;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 13px;
            color: #777;
            margin: 0;
        }
        .card { 
            background: #ffffff; 
            padding: 24px 16px; 
            border-radius: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
        }
        .card h2 { 
            text-align: center; 
            color: #444; 
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        /* 固定圖表容器高度，避免手機版過度壓縮 */
        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🥗 飲食健康總覽</h1>
        <p>為您掌握近期的熱量攝取狀況</p>
    </div>
    
    <div class="card">
        <h2>近期熱量攝取趨勢 (大卡)</h2>
        <div class="chart-container">
            <canvas id="calorieChart"></canvas>
        </div>
    </div>

    <script>
        // 初始化 LIFF
        liff.init({ liffId: "2011395673-tx0PwnXv" }).then(() => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(profile => {
                    const userId = profile.userId;
                    
                    fetch(`/api/nutrition/${userId}`)
                        .then(response => response.json())
                        .then(data => {
                            // 1. 處理過長的標籤文字，超過 6 個字加上 "..."
                            const shortLabels = data.labels.map(label => 
                                label.length > 6 ? label.substring(0, 6) + '...' : label
                            );

                            const ctx = document.getElementById('calorieChart').getContext('2d');
                            new Chart(ctx, {
                                type: 'bar',
                                data: {
                                    labels: shortLabels,
                                    datasets: [{
                                        label: '預估熱量',
                                        data: data.calories,
                                        backgroundColor: 'rgba(255, 140, 66, 0.7)', // 調整為更溫暖的漸層橘
                                        borderColor: 'rgba(255, 140, 66, 1)',
                                        borderWidth: 1,
                                        borderRadius: 6, // 讓長條圖邊緣變圓滑
                                        barPercentage: 0.6 // 讓長條圖稍微變細，增加呼吸空間
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false, // 允許 CSS 控制高度
                                    plugins: {
                                        legend: { display: false }, // 隱藏佔空間的圖例
                                        tooltip: {
                                            callbacks: {
                                                // 點擊 Tooltip 時顯示完整的長菜名
                                                title: function(context) {
                                                    return data.labels[context[0].dataIndex];
                                                }
                                            }
                                        }
                                    },
                                    scales: { 
                                        x: { 
                                            grid: { display: false }, // 隱藏 X 軸背景網格線
                                            ticks: {
                                                maxRotation: 45,
                                                minRotation: 45, // 強制字體傾斜 45 度排列整齊
                                                font: { size: 12, color: '#666' }
                                            }
                                        },
                                        y: { 
                                            beginAtZero: true,
                                            grid: { color: '#f0f0f0', drawBorder: false },
                                            ticks: { font: { size: 12, color: '#999' } }
                                        }
                                    }
                                }
                            });
                        })
                        .catch(err => console.error("API 呼叫失敗", err));
                });
            } else {
                liff.login();
            }
        });
    </script>
</body>
</html>
